services:
  web:
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    build: .
    container_name: business_web
    restart: always
    volumes:
      - static_volume:/app/staticfiles
      - ./media:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_network

  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    image: dietfactory-postgres
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    container_name: business_postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - db_network

  nginx:
    image: dietfactory-nginx
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: business_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - static_volume:/app/staticfiles
      - ./media:/app/media
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - db_network

  certbot:
    profiles: ["maintenance"]
    image: dietfactory-certbot
    build:
      context: .
      dockerfile: docker/certbot.Dockerfile
    container_name: business_certbot
    restart: "no"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - certbot_logs:/var/log/letsencrypt
      - certbot_work:/var/lib/letsencrypt
    entrypoint: ["certbot"]
    command: ["renew", "--webroot", "-w", "/var/www/certbot", "--non-interactive"]

  adminer:
    profiles: ["tools"]
    image: dietfactory-adminer
    build:
      context: .
      dockerfile: docker/adminer.Dockerfile
    container_name: business_adminer
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - db_network

volumes:
  static_volume:
  postgres_data:
  certbot_www:
  certbot_logs:
  certbot_work:

networks:
  db_network:
    driver: bridge
