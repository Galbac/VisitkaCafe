# Only POST requests consume the rate limit; client-supplied X-Forwarded-For is ignored.
map $request_method $submission_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $submission_key zone=public_forms:10m rate=5r/m;
limit_req_zone $submission_key zone=admin_login:10m rate=5r/m;
server_tokens off;

# Reject unrecognised Host/SNI instead of redirecting arbitrary hostnames.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
