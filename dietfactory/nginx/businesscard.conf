server {
    listen 80;
    server_name bezvreda05.ru www.bezvreda05.ru;

    # Точка входа для автоматического обновления SSL через Certbot (ACME Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные запросы принудительно перенаправляем на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bezvreda05.ru www.bezvreda05.ru;

    ssl_certificate /etc/letsencrypt/live/bezvreda05.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bezvreda05.ru/privkey.pem;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 12M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Защитные заголовки
    add_header X-Content-Type-Options "nosniff" always;
    
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME Challenge на 443
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* ^/media/.*\.(png|jpe?g|webp|gif|svg|pdf)$ {
        root /app;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'; style-src 'unsafe-inline'" always;
    }
    location /media/ { return 404; }

    location ~ ^/(order|contact|reviews)/?$ {
        limit_req zone=public_forms burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location = /admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/conf.d/proxy.inc;
    }
    location / {
        include /etc/nginx/conf.d/proxy.inc;
    }
}
